<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Menu — MiseEnPlace PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#faf9f6;color:#1a1a1a;min-height:100vh;}

/* HEADER */
.header{background:#1a1a1a;padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.header img{height:48px;filter:invert(1) hue-rotate(180deg);}
.header-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:6px;letter-spacing:.06em;text-transform:uppercase;}

/* BACK BAR */
.back-bar{background:#fff;border-bottom:1px solid #e0ded8;padding:10px 16px;display:none;align-items:center;gap:10px;position:sticky;top:88px;z-index:99;}
.back-btn{background:none;border:none;font-size:15px;color:#1a1a1a;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600;padding:0;}
.back-bar-cat{font-size:14px;color:#aaa;margin-left:auto;}

/* CONTENT */
.content{max-width:640px;margin:0 auto;padding:20px 12px 48px;}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 0;}
.cat-card{background:#fff;border:1px solid #e8e5df;border-radius:16px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;}
.cat-card:active{transform:scale(.97);}
.cat-card-icon{font-size:36px;margin-bottom:10px;display:block;}
.cat-card-name{font-size:14px;font-weight:700;color:#1a1a1a;line-height:1.3;}
.cat-card-count{font-size:11px;color:#aaa;margin-top:4px;}

/* CATEGORY SECTION (dish list) */
.cat-section{margin-bottom:36px;}
.cat-section-title{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.1em;padding:8px 0 12px;border-bottom:1px solid #e0ded8;margin-bottom:14px;}
.cat-section-title span{font-size:18px;margin-right:8px;}

/* DISH CARD */
.dish-card{background:#fff;border:1px solid #e8e5df;border-radius:14px;margin-bottom:10px;overflow:hidden;display:flex;flex-direction:column;}
.dish-body{padding:14px 16px 12px;}
.dish-nome{font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:6px;line-height:1.3;}
.dish-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px;}
.dish-tag{font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;}
.tag-vegetariano{background:#dcfce7;color:#15803d;}
.tag-vegano{background:#bbf7d0;color:#14532d;}
.tag-venduto{background:#fef3c7;color:#b45309;}
.tag-consigliato{background:#dbeafe;color:#1d4ed8;}
.tag-novita{background:#ede9fe;color:#7c3aed;}
.tag-tipico{background:#fff7ed;color:#c2410c;}
.dish-desc{font-size:13px;color:#777;line-height:1.5;}
.dish-allergeni{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.allerg-badge{font-size:10px;padding:2px 7px;border-radius:10px;background:#fef3f2;color:#c0392b;border:1px solid #fcd5d2;font-weight:500;}
.tracce-badge{font-size:10px;padding:2px 7px;border-radius:10px;background:#fdf8ed;color:#8a6d1f;border:1px solid #f5e0a0;font-weight:500;}
.dish-footer{background:#f7f6f2;border-top:1px solid #eeebe4;padding:9px 16px;display:flex;justify-content:flex-start;align-items:center;}
.dish-price{font-size:14px;font-weight:400;color:#888;}

/* EMPTY / LOADING */
.empty{text-align:center;padding:60px 20px;color:#bbb;font-size:15px;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.loading{text-align:center;padding:80px 20px;color:#bbb;font-size:15px;}

/* FOOTER */
.footer{text-align:center;padding:16px;font-size:11px;color:#bbb;border-top:1px solid #e0ded8;margin-top:8px;}
.footer a{color:#bbb;text-decoration:none;}
</style>
</head>
<body>

<div class="header">
  <img src="./logo.png" alt="MiseEnPlace PRO"/>
  <div class="header-sub" id="header-sub">Il nostro menu</div>
</div>

<div class="back-bar" id="back-bar">
  <button class="back-btn" onclick="showCategories()">&#8592; Categorie</button>
  <span class="back-bar-cat" id="back-bar-cat"></span>
</div>

<div class="content" id="content">
  <div class="loading">&#8230; caricamento menu</div>
</div>

<div class="footer">
  &copy; 2026 MiseEnPlace PRO &mdash; <a href="mailto:info@miseenplacepro.it">info@miseenplacepro.it</a>
  <div id="update-date" style="margin-top:4px;"></div>
</div>

<script>
var CAT_ORDER=[
  {key:'Antipasti',      icon:'🥗'},
  {key:'Primi piatti',   icon:'🍝'},
  {key:'Secondi piatti', icon:'🍖'},
  {key:'Contorni',       icon:'🥦'},
  {key:'Dolci',          icon:'🍮'},
  {key:'Caffetteria',    icon:'☕'},
  {key:'Vini',           icon:'🍷'},
  {key:'Birre',          icon:'🍺'},
  {key:'Cocktail',       icon:'🍹'},
  {key:'Soft drink',     icon:'🥤'},
  {key:'Bevande',        icon:'🥤'},
  {key:'Beverage vario', icon:'🥤'}
];

var _grouped={};
var _catKeys=[];

function eur(v){return (parseFloat(v)||0).toFixed(2).replace('.',',')+'€';}

function catIcon(key){
  var found=CAT_ORDER.find(function(c){return c.key.toLowerCase()===key.toLowerCase();});
  return found?found.icon:'🍽';
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showCategories(){
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('back-bar').style.display='none';
  document.getElementById('header-sub').textContent='Il nostro menu';

  var html='<div class="cat-grid">';
  _catKeys.forEach(function(cat){
    var count=(_grouped[cat]||[]).length;
    var catEnc=encodeURIComponent(cat);
    html+='<div class="cat-card" onclick="showCategory(\''+catEnc+'\')">';
    html+='<span class="cat-card-icon">'+catIcon(cat)+'</span>';
    html+='<div class="cat-card-name">'+escHtml(cat)+'</div>';
    html+='<div class="cat-card-count">'+(count===0?'in aggiornamento':count+(count===1?' piatto':' piatti'))+'</div>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}

function showCategory(catEnc){
  var cat=decodeURIComponent(catEnc);
  var piatti=(_grouped[cat]||[]);
  window.scrollTo({top:0,behavior:'smooth'});

  var backBar=document.getElementById('back-bar');
  backBar.style.display='flex';
  document.getElementById('back-bar-cat').textContent=catIcon(cat)+' '+cat;
  document.getElementById('header-sub').textContent='Il nostro menu';

  var TAG_MAP={
    'Vegetariano':  {cls:'tag-vegetariano', icon:'🌿'},
    'Vegano':       {cls:'tag-vegano',       icon:'🌱'},
    'Più venduto':  {cls:'tag-venduto',      icon:'🔥'},
    'Consigliato':  {cls:'tag-consigliato',  icon:'⭐'},
    'Novità':       {cls:'tag-novita',       icon:'✨'},
    'Del territorio':{cls:'tag-tipico',       icon:'🏠'}
  };

  var html='<div class="cat-section">';
  html+='<div class="cat-section-title"><span>'+catIcon(cat)+'</span>'+escHtml(cat)+'</div>';
  piatti.forEach(function(p){
    html+='<div class="dish-card"><div class="dish-body">';
    html+='<div class="dish-nome">'+escHtml(p.nome)+'</div>';
    // tag
    var tags=p.tags||[];
    if(tags.length){
      html+='<div class="dish-tags">';
      tags.forEach(function(t){
        var tm=TAG_MAP[t]||{cls:'tag-tipico',icon:''};
        html+='<span class="dish-tag '+tm.cls+'">'+tm.icon+' '+escHtml(t)+'</span>';
      });
      html+='</div>';
    }
    if(p.descrizione) html+='<div class="dish-desc">'+escHtml(p.descrizione)+'</div>';
    var badges='';
    (p.allergeni||[]).forEach(function(a){ badges+='<span class="allerg-badge">'+escHtml(a)+'</span>'; });
    (p.tracce||[]).forEach(function(a){ badges+='<span class="tracce-badge">tracce: '+escHtml(a)+'</span>'; });
    if(badges) html+='<div class="dish-allergeni">'+badges+'</div>';
    html+='</div>';
    html+='<div class="dish-footer"><span class="dish-price">'+eur(p.prezzoVendita)+'</span></div>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}

function buildMenu(data){
  var piatti=data.menuData||[];
  if(!piatti.length){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">🍽</div>Menu in aggiornamento — torna presto!</div>';
    return;
  }

  piatti.forEach(function(p){
    var cat=p.categoria||'Altro';
    if(!_grouped[cat]) _grouped[cat]=[];
    _grouped[cat].push(p);
  });

  // usa tutte le categorie definite in CAT_ORDER, più eventuali extra dai dati
  var extraKeys=Object.keys(_grouped).filter(function(k){
    return !CAT_ORDER.find(function(c){return c.key.toLowerCase()===k.toLowerCase();});
  });
  _catKeys=CAT_ORDER.map(function(c){return c.key;}).concat(extraKeys);

  if(data.exportDate){
    document.getElementById('update-date').textContent='Aggiornato il '+data.exportDate;
  }

  showCategories();
}

fetch('./dati-pubblici.json?v='+Date.now())
  .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
  .then(buildMenu)
  .catch(function(){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">🍽</div>Menu temporaneamente non disponibile.<br><small>Riprova tra qualche minuto.</small></div>';
  });
</script>
</body>
</html>
